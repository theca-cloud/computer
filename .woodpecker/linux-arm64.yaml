# The checks on Linux arm64: the Docker agent on the developer's Mac (Apple
# Silicon runs arm64 containers natively), until there's arm64 hardware for
# CI. Moving it is giving another agent the label. While the Mac sleeps, it
# waits. Same steps as linux.yaml but deny (the same result anywhere).
labels:
  platform: linux/arm64

when:
  - event: push
    path:
      exclude: ["**/*.md", "LICENSE", ".gitignore", "cliff.toml"]
    evaluate: 'not (trim(CI_COMMIT_MESSAGE) matches "^[0-9]+[.][0-9]+[.][0-9]+$")'
  - event: manual

services:
  - name: postgres
    image: postgres:18
    environment:
      POSTGRES_USER: theca
      POSTGRES_PASSWORD: theca
      POSTGRES_DB: theca
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8

variables:
  - &image
    image: git.pband.ch/theca/ci-computer:1.98.0
    pull: true
    environment:
      DATABASE_URL: postgres://theca:theca@postgres:5432/theca

steps:
  - name: lint
    <<: *image
    commands:
      - scripts/ci.sh lint

  - name: test
    <<: *image
    depends_on: [lint]
    commands:
      - scripts/ci.sh test

  - name: app
    <<: *image
    depends_on: [lint]
    commands:
      - scripts/ci.sh app
