# The checks on Windows: the `local` agent in a Windows VM on the CI server
# (dockurr/windows, KVM), with Git Bash for scripts/ci.sh. The local backend has
# no services, and the server is a Linux program: the end-to-end tests use a
# shared test server running on Linux (the core this repo pins), its address
# and admin from repo secrets; they run one at a time (scripts/ci.sh, test).
labels:
  platform: windows/amd64

when:
  - event: push
    path:
      exclude: ["**/*.md", "LICENSE", ".gitignore", "cliff.toml"]
    evaluate: 'not (trim(CI_COMMIT_MESSAGE) matches "^[0-9]+[.][0-9]+[.][0-9]+$")'
  - event: manual

steps:
  # Lint builds the app for Windows too (the `gui` feature, WebView2).
  - name: lint
    image: bash
    commands:
      - scripts/ci.sh lint

  - name: test
    image: bash
    depends_on: [lint]
    environment:
      THECA_TEST_SERVER_URL:
        from_secret: theca_test_server_url
      THECA_TEST_ADMIN_EMAIL:
        from_secret: theca_test_admin_email
      THECA_TEST_ADMIN_PASSWORD:
        from_secret: theca_test_admin_password
    commands:
      - scripts/ci.sh test
