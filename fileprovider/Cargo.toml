[package]
name = "theca-fileprovider"
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# macOS's drive (sprint 16, ADR 0008): the File Provider extension, bundled as
# Theca.app/Contents/PlugIns/ThecaDrive.appex, and the app's own File Provider
# calls. Every Objective-C call is `unsafe`: they live here, so `theca` keeps
# `forbid(unsafe_code)`. The protocol between the two is plain Rust.

# Linked with Foundation's _NSExtensionMain as its entry point (build.rs).
[[bin]]
name = "theca-drive"
path = "src/bin/theca-drive.rs"
test = false

# Tests' and CI's: a command run with dataless files materializing.
[[bin]]
name = "theca-materialize"
path = "src/bin/theca-materialize.rs"
test = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-file-provider = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
