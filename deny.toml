# cargo-deny: the same rules as core's: permissive (and file-level copyleft)
# licenses only, so the code can also ship in a proprietary EE build.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, no known vulnerability, all from Tauri's Linux side (the
    # app only): gtk-rs 0.18's macros (Tauri's GTK 3 stack, via tray-icon) and
    # zbus 5's type crates (the opener and single-instance plugins). They go
    # when Tauri moves; drop each entry then.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via gtk-rs 0.18 (Tauri)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via zbus 5 (Tauri plugins)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via zbus 5 (Tauri plugins)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via zbus 5 (Tauri plugins)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Our own crates are AGPL (we own the copyright); third-party AGPL/GPL stays denied.
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "theca-common" },
    { allow = ["AGPL-3.0-only"], crate = "theca-client" },
    { allow = ["AGPL-3.0-only"], crate = "theca" },
    { allow = ["AGPL-3.0-only"], crate = "theca-fileprovider" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# core's releases, from its public mirror (Cargo.toml).
allow-git = ["https://github.com/theca-cloud/core"]
