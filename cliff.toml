# git-cliff: the changelog and the next version from the Conventional Commits
# squashed into dev. Used by scripts/release.sh.

[changelog]
header = "# Changelog\n\n"
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
    { message = "(?i)^docs\\(roadmap\\)", skip = true },
    { message = "(?i)^feat", group = "<!-- 0 -->Features" },
    { message = "(?i)^fix", group = "<!-- 1 -->Fixes" },
    { message = "(?i)^perf", group = "<!-- 2 -->Performance" },
    { message = "(?i)^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "(?i)^docs", group = "<!-- 4 -->Documentation" },
    { message = "(?i)^(build|ci)", group = "<!-- 5 -->Build and CI" },
    { message = "(?i)^(test|chore|style)", skip = true },
]

[bump]
# Before 1.0.0, features and breaking changes bump the minor version: 0.x never
# reaches 1.0.0 by itself (scripts/release.sh 1.0.0 does). From 1.0.0, semver.
features_always_bump_minor = true
breaking_always_bump_major = false
