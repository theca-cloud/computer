# The release (ADR 0005): on a version tag, which Woodpecker's release.yaml
# pushes here with prod once its checks passed: the tests on the other
# platforms (test.yml), on this very commit, then every package built natively
# on its runner and checked (ci/package.sh), then one GitHub release with them
# all, created only once every package passed. By hand (workflow_dispatch) on a
# branch, it tests, builds and checks the packages without releasing, signed
# with a throwaway key: they stay on the run. By hand on a tag, the packaging
# refuses: without the release key it signs nothing (ci/package.sh).
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: macos, arch: arm64 }
          - { runner: macos-15-intel, os: macos, arch: x86_64 }
          - { runner: windows-2025, os: windows, arch: x86_64 }
          # The oldest Ubuntu: glibc 2.35, so the packages run on Ubuntu
          # 22.04+ and Debian 12+.
          - { runner: ubuntu-22.04, os: linux, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    # No Rust cache (test.yml has one): a release builds from scratch.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ui/.nvmrc
      # Tauri's Linux prerequisites (as in test.yml and ci/Dockerfile), and
      # what its AppImage bundler runs.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - run: ci/package.sh ${{ matrix.os }} ${{ matrix.arch }}
        # The updater's signatures (ADR 0006): the release key, here only, and
        # on a pushed version tag only. A run by hand gets none: from a branch
        # it signs with a throwaway key (ci/package.sh), its artifacts,
        # downloadable from a public repository, no install's update; on a tag,
        # ci/package.sh refuses to package without the release key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # latest.json, the updater's manifest (ci/manifest.py), from every
  # package's .sig: on every run, a manual one included (kept with the run),
  # so a release's is known good before one is made.
  manifest:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: latest.json
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          # This version's section of the changelog (none on a manual run).
          awk -v h="## [$version]" 'index($0, h) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          ci/manifest.py "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$version" dist notes.md > latest.json
          cat latest.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manifest
          path: latest.json
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # This version's section of the changelog, and how to open an
          # unsigned app (signing comes with Distribution).
          awk -v h="## [$TAG]" 'index($0, h) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          printf '\nThe apps are not signed yet: [how to open them](https://github.com/%s/blob/%s/USING.md#opening-an-unsigned-app).\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
